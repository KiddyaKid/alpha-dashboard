<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1f">
<title>$ALPHA 雷达 · 沐珩</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* design system (from memechan refs)
   type: 22px lilac board title · 15px bold yellow ticker · 14px bold white headline · 13px body · 11.5px grey meta (min 11px)
   color: yellow=ids/tickers/highlights · green=greentext/+%/bars · red=-%/risk · lilac=active tab/links · grey=time/meta · white=primary
   space: one fact per line, 1px #333 separators, no decoration */
:root{--bg:#8b80d9;--panel:#1c1c1f;--panel2:#26262b;--line:#333338;--ink:#ececee;--sub:#8e8e96;--dim:#6a6a72;
--yellow:#f2d45c;--lilac:#b4a7f5;--lilacbg:#a99cf0;--green:#a3d977;--red:#f07178;
--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:13px/1.6 var(--mono);overflow-x:hidden;
 background:var(--bg) radial-gradient(rgba(255,255,255,.2) 1px,transparent 1.2px) 0 0/14px 14px}
a{color:var(--lilac);text-decoration:none}
button{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--panel);padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticker{font-weight:700;font-size:13px}.ticker i{font-style:normal;color:var(--lilac)}
.upd{font-size:11px;color:var(--sub);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:8px}
.tab{flex:0 0 auto;padding:3px 9px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:13px;cursor:pointer}
.tab.on{background:var(--lilacbg);color:#111}
main{max-width:640px;margin:0 auto;padding:10px 8px 30px}
.term{background:var(--panel);border-radius:10px;padding:14px 12px;margin-bottom:10px;overflow:hidden}
.panel{display:none}.panel.on{display:block}
.sub{color:var(--sub)}.dim{color:var(--dim)}.y{color:var(--yellow)}.l{color:var(--lilac)}.g{color:var(--green)}.r{color:var(--red)}
.pos{color:var(--green)}.neg{color:var(--red)}
.sec{color:var(--green);font-weight:700;font-size:13px}
.secsub{color:var(--sub);font-size:11.5px;margin:0 0 10px}
/* meters */
.meter{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;font-size:12px;line-height:1.9}
.meter .k{color:var(--sub);white-space:nowrap}.meter .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.vb{display:flex;gap:1.5px;overflow:hidden;height:12px}
.vb i{flex:1 1 0;min-width:1px;max-width:3px;background:#55555c;border-radius:1px}
.vb i.f{background:var(--yellow)}
/* table */
table.tt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.tt th{background:var(--yellow);color:#111;text-align:left;font-weight:600;padding:4px 8px}
.tt td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .n{text-align:right;font-variant-numeric:tabular-nums}
/* event log */
.ev{display:grid;grid-template-columns:44px 54px 1fr;gap:0 8px;padding:5px 0;font-size:12px;align-items:baseline}
.ev .t{color:var(--dim);font-variant-numeric:tabular-nums}
.ev .tag{font-weight:700;font-size:11px;text-align:center;border-radius:3px}
.tag.ALERT{background:var(--lilacbg);color:#111}.tag.NEW{color:var(--green)}.tag.DEL{color:var(--red)}.tag.VERIFY{color:var(--yellow)}
.ev .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .d{grid-column:3;color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{color:var(--sub);font-size:11px;padding:8px 0 2px;border-top:1px solid var(--line);margin-top:4px}
/* desk board */
.boardh{text-align:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.boardh h1{color:var(--lilac);font-size:22px;margin:0 0 2px;font-weight:700}
.boardh div{color:var(--sub);font-size:11.5px}
.alert{color:var(--yellow);font-size:12.5px;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post{padding:14px 0;border-bottom:1px solid var(--line)}
.post:last-of-type{border-bottom:0}
.ph{cursor:pointer}
.tile{width:48px;height:48px;border-radius:6px;background:#2d2d33;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
.hl{font-weight:700;font-size:14px;line-height:1.35}
.tk{color:var(--yellow);font-weight:700;font-size:15px}
.meta{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink);font-weight:600}
.vf{font-size:12px;margin:8px 0 4px;color:var(--sub)}
.gt{color:var(--green);font-size:12.5px;line-height:1.55;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel{font-size:12px;margin-top:6px;color:var(--sub)}.rel span{margin-right:10px;white-space:nowrap}
.ca{font-size:11.5px;color:var(--sub);display:flex;gap:10px;align-items:baseline;margin-top:4px;white-space:nowrap}
.ca code{color:var(--lilac);font-family:inherit}
.lnk{color:var(--sub);cursor:pointer;background:none;border:0;padding:0;font-size:11.5px}
.lnk.ok{color:var(--green)}
.foot{display:flex;align-items:stretch;font-size:12px;margin:12px -12px -14px;border-top:1px solid var(--line)}
.foot b{background:var(--lilacbg);color:#111;font-weight:600;padding:5px 10px}
.foot span{padding:5px 10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot em{font-style:normal;background:#3a3a40;padding:2px 8px;margin:3px 3px 3px 0;border-radius:3px;white-space:nowrap}
/* coins */
.ccard{background:var(--panel2);border-radius:8px;padding:10px 10px 0;margin-bottom:8px;overflow:hidden;cursor:pointer}
.ccard .row1{display:block}
.ccard .tile{width:56px;height:56px;font-size:30px}
.cname{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cname .mc{font-weight:700;white-space:nowrap;font-size:13.5px}
.cblurb{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11.5px;color:var(--sub);display:flex;gap:12px;white-space:nowrap}
.cmeta b{color:var(--ink);font-weight:600}
.pbar{height:3px;background:#3a3a40;margin:10px -10px 0}.pbar i{display:block;height:100%;background:var(--green)}
.sorts{display:inline-flex;background:var(--panel2);border-radius:6px;padding:2px;gap:2px}
.sorts button{border:0;background:none;color:var(--ink);font-size:12px;padding:1px 7px;border-radius:4px;cursor:pointer}
.sorts button.on{background:var(--green);color:#111}
/* topics */
.trow{padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.trow:first-child{border-top:0;padding-top:0}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nm{font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:flex;gap:3px;flex:0 0 auto}
.grid i{width:13px;height:13px;border-radius:2px;background:#2f2f35;display:block}
.g1{background:#3d4a2c!important}.g2{background:#5b7a36!important}.g3{background:#7fae45!important}.g4{background:#a3d977!important}.g5{background:#d4f5a8!important}
.gp{opacity:.6}
.retired{opacity:.5;font-size:12px;padding:6px 0}
.live{font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:center;margin-top:10px}
.live .ld{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block}
.live.on .ld{background:var(--green)}
/* detail sheet */
.sheet{position:fixed;inset:0;background:rgba(20,14,60,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panelx{background:var(--panel);width:100%;max-width:640px;max-height:90vh;overflow:auto;overflow-x:hidden;border-radius:12px 12px 0 0;padding:16px 12px calc(20px + env(safe-area-inset-bottom))}
.close{float:right;border:0;background:var(--lilacbg);color:#111;border-radius:6px;width:30px;height:28px;font-size:14px;cursor:pointer}
.box{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.box>.sec{margin-bottom:6px}
.verdict{font-size:13px;margin:10px 0 0;padding-left:9px;border-left:3px solid}
.s-up{border-color:var(--green)}.s-risk{border-color:var(--red)}.s-watch{border-color:var(--yellow)}.s-info{border-color:var(--lilac)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:12px;margin:4px 0}.kv .k{color:var(--sub)}
ul.src{list-style:none;padding:0;margin:0}ul.src li{padding:6px 0;border-top:1px solid var(--line);font-size:12px}ul.src li:first-child{border-top:0}
details summary{cursor:pointer;color:var(--lilac);font-size:12px}
.fig{font:11px/1.3 var(--mono);white-space:pre;overflow-x:auto;margin:6px 0;color:#d6d6da}
.wk{display:flex;gap:6px;margin-top:4px}.wk div{text-align:center;font-size:11px;color:var(--sub)}.wk i{display:block;width:30px;height:22px;border-radius:3px;background:#2f2f35;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--lilacbg);color:#111;padding:6px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
footer{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:4px}
footer a,footer button{color:#1f1846;background:none;border:0;padding:4px;cursor:pointer;font-weight:600}

/* ===== desktop terminal grid (>=1024px only; mobile untouched) ===== */
#dk{display:none}
@media (min-width:1024px){
 html,body{background:#0b0b0c;height:100%;overflow:hidden}
 body>header,body>main{display:none}
 #dk{display:flex;flex-direction:column;height:100vh;font:12px/1.5 var(--mono);color:var(--ink)}
 .dbar{display:flex;align-items:center;gap:14px;height:24px;padding:0 10px;background:#141415;border-bottom:1px solid #3a3416;font-size:11.5px;white-space:nowrap;flex:0 0 auto}
 .dbar .dt{color:var(--sub);cursor:pointer;background:none;border:0;padding:0 2px;font-size:11.5px}
 .dbar .dt b{color:var(--yellow);font-weight:600;margin-right:4px}
 .dbar .dt.on{color:#111;background:var(--yellow)}.dbar .dt.on b{color:#111}
 .dbar .sp{flex:1}.dbar .st{color:var(--sub)}.dbar .st .g{font-weight:600}
 .dbar #dxl{border:1px solid var(--yellow);color:var(--yellow);background:none;padding:0 8px;font-size:11px;cursor:pointer}
 .dg{flex:1;min-height:0;display:grid;gap:6px;padding:6px;grid-template-columns:1.3fr 1fr .95fr;grid-template-rows:auto 1fr .95fr;
  grid-template-areas:"board tape view" "board tape coins" "topics wire rank"}
 .dp{border:1px solid #6f6420;background:#121213;display:flex;flex-direction:column;min-height:0;min-width:0}
 .dp.hi{border-color:var(--yellow)}
 .dpb{flex:1;min-height:0;overflow:auto;overflow-x:hidden;padding:8px 10px;scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
 .dpf{display:flex;align-items:center;gap:8px;height:20px;border-top:1px solid #2a2a2e;font-size:11px;color:var(--sub);flex:0 0 auto;white-space:nowrap}
 .dpf .lb{height:100%;padding:0 7px;display:flex;align-items:center;font-weight:700;color:#111}
 .dpf .ct{margin-left:auto;padding-right:8px}
 .lb.BOARD{background:var(--yellow)}.lb.TAPE{background:var(--green)}.lb.VIEW{background:var(--lilacbg)}.lb.COINS{background:#e3a35a}.lb.RANK{background:#8fc7e8}.lb.TOPICS{background:var(--green)}.lb.WIRE{background:#e88fb0}
 .dh{color:var(--yellow);font-weight:700;font-size:13px}
 .dsub{color:var(--sub);font-size:11px}
 .bh{text-align:center;border-bottom:1px solid var(--line);padding:2px 0 8px;margin-bottom:2px}
 .bh h1{font-size:18px;color:var(--ink);margin:0;font-weight:700}
 .bh .al{color:var(--yellow);font-size:12px;margin-top:4px;text-align:left}
 .dpost{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
 .dpost:hover{background:#18181a}
 .dpost .h{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dpost .tk{font-size:13px}
 .dpost .m{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dpost .m b{color:var(--ink)}
 .dpost .vf2{font-size:11px;margin:3px 0 2px;color:var(--sub)}
 .dpost .gt{font-size:12px;margin:1px 0;-webkit-line-clamp:2}
 .dpost .ca{font-size:11px;margin-top:3px}
 .tp{display:grid;grid-template-columns:82px 44px 1fr auto;gap:0 8px;padding:3px 0 4px;border-bottom:1px solid #1f1f22;font-size:12px;align-items:baseline}
 .tp .t{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
 .tp .k{font-size:10.5px;font-weight:700;text-align:center;padding:0 3px}
 .k.ALERT{background:var(--lilacbg);color:#111}.k.NEW{background:#2f4a1e;color:var(--green)}.k.MOVE{background:#3a3416;color:var(--yellow)}.k.DEL{background:#4a1e22;color:var(--red)}
 .tp .x{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .tp .v{text-align:right;font-variant-numeric:tabular-nums}
 .tp .n{grid-column:3/5;color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .fv{cursor:pointer}.fv .big{color:var(--yellow);font-size:22px;font-weight:700;line-height:1.2}
 .fv .row{display:flex;gap:16px;font-size:13px;margin-top:4px}.fv .row span{color:var(--sub)}.fv .row b{color:var(--ink)}
 .fv .nar{color:var(--sub);font-size:11.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 table.dt2{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
 .dt2 th{color:var(--sub);font-weight:400;text-align:left;font-size:11px;padding:0 4px 3px;border-bottom:1px solid var(--line)}
 .dt2 td{padding:3px 4px;border-bottom:1px solid #1f1f22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dt2 .n{text-align:right;font-variant-numeric:tabular-nums}
 .dt2 tr[data-open]{cursor:pointer}.dt2 tr[data-open]:hover td{background:#18181a}
 .dt2 .lnk{font-size:11px}
 .tr2{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #1f1f22;cursor:pointer;font-size:12px}
 .tr2 .grid i{width:11px;height:11px}
 .wr{padding:5px 0;border-bottom:1px solid #1f1f22;font-size:12px}
 .wr .a{color:var(--yellow);font-weight:600}.wr .t{color:var(--dim);margin-right:6px}
 .wr .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
 .wr .s{color:var(--sub);font-size:11px}
 .sheet{align-items:center}.panelx{border-radius:0;border:1px solid var(--yellow);max-height:86vh}
}
</style>

function doExport(){
  const {posts,heat,coins}=sheets(),name="alpha_"+D.meta.updated.slice(0,10);
  if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(posts),"帖子与来源");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(heat),"话题热度");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(coins),"代币");XLSX.writeFile(wb,name+".xlsx");return}
  const csv=rows=>{const k=Object.keys(rows[0]);return [k.join(",")].concat(rows.map(o=>k.map(x=>'"'+String(o[x]??"").replace(/"/g,'""')+'"').join(","))).join("\n")};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv(posts)+"\n\n"+csv(heat)+"\n\n"+csv(coins)],{type:"text/csv"}));a.download=name+".csv";a.click();
}
$("#xl").onclick=doExport;
const emb=JSON.parse($("#embedded").textContent);render(emb);
const legacy={h24:"desk",home:"topics",lead:"coins",hist:"feed",musk:"desk",export:"desk"};
{let h=location.hash.slice(1);h=legacy[h]||h;const b=h&&document.querySelector(`.tab[data-p="${h}"]`);if(b)b.click();else if(h.startsWith("t=")&&D.topics.some(x=>x.id===h.slice(2)))detail(h.slice(2))}
fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.version>=3&&((d.meta.prices_updated||"")>(emb.meta.prices_updated||"")||d.meta.updated>emb.meta.updated)){const cur=document.querySelector(".tab.on");render(d);cur&&cur.click()}}).catch(()=>{}).finally(()=>{live();setInterval(live,60000)});
</script>
</body>
</html>
