<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1f">
<title>$ALPHA 雷达 · 沐珩</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#8b80d9;--panel:#1c1c1f;--panel2:#26262b;--line:#333338;--ink:#e8e8ea;--sub:#8b8b93;--dim:#5d5d66;
--yellow:#f2d45c;--lilac:#b4a7f5;--lilacbg:#a99cf0;--green:#a3d977;--red:#f07178;--blue:#8fb8ff;
--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:13px/1.55 var(--mono);overflow-x:hidden;
 background:var(--bg) radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.2px) 0 0/14px 14px}
a{color:var(--lilac);text-decoration:none}
button{font:inherit}
/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--panel);padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticker{font-weight:700;letter-spacing:.3px}.ticker i{font-style:normal;color:var(--lilac)}
.upd{font-size:11px;color:var(--sub);white-space:nowrap}.upd b{color:var(--ink);font-weight:600}
.dots{display:inline-flex;gap:3px;background:#3a3a40;border-radius:6px;padding:5px 6px;margin-left:6px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.tabs{display:flex;gap:4px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:4px 9px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:13px;cursor:pointer}
.tab.on{background:var(--lilacbg);color:#111}
main{max-width:640px;margin:0 auto;padding:10px 8px 40px}
.term{background:var(--panel);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 4px 18px rgba(30,20,80,.25);overflow:hidden}
.panel{display:none}.panel.on{display:block}
.sub{color:var(--sub)}.dim{color:var(--dim)}.y{color:var(--yellow)}.l{color:var(--lilac)}.g{color:var(--green)}.r{color:var(--red)}
.h{font-weight:700;color:var(--green);margin:0 0 2px}
.sec{color:var(--green);font-weight:700;margin:14px 0 2px}.sec:first-child{margin-top:0}
.secsub{color:var(--sub);font-size:12px;margin-bottom:8px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
/* meters */
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:2px 0;font-size:12px}
.meter .k{color:var(--sub);white-space:nowrap}
.meter .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.vb{display:flex;gap:1.5px;overflow:hidden;height:13px;align-items:stretch}
.vb i{flex:1 1 0;min-width:1px;max-width:3px;background:#55555c;border-radius:1px}
.vb i.f{background:var(--yellow)}.vb.gr i.f{background:var(--green)}.vb.rd i.f{background:var(--red)}.vb.li i.f{background:var(--lilac)}
/* yellow-header table */
table.tt{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.tt th{background:var(--yellow);color:#111;text-align:left;font-weight:600;padding:3px 6px}
.tt td{padding:4px 6px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .n{text-align:right;font-variant-numeric:tabular-nums}
.state{color:var(--sub)}
/* event log */
.log{font-size:12px}
.ev{display:grid;grid-template-columns:76px 52px 1fr;gap:0 8px;padding:3px 0;align-items:baseline}
.ev .t{color:var(--dim);font-variant-numeric:tabular-nums}
.ev .tag{font-weight:700;font-size:10.5px;text-align:center;border-radius:4px;padding:0 3px}
.tag.ALERT{background:var(--lilacbg);color:#111}.tag.NEW{background:rgba(163,217,119,.18);color:var(--green)}
.tag.DEL{background:rgba(240,113,120,.18);color:var(--red)}.tag.VERIFY{background:rgba(242,212,92,.15);color:var(--yellow)}
.ev .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .d{grid-column:3;color:var(--sub);font-size:11px;white-space:normal}
/* board / desk */
.boardh{text-align:center;margin:4px 0 10px}
.boardh .nav{font-size:12px;color:var(--sub);text-align:left}.boardh .nav b{color:var(--green)}
.boardh h1{color:var(--lilac);font-size:21px;margin:8px 0 2px;letter-spacing:.3px}
.thread{padding:10px 0;border-top:1px solid var(--line)}
.op{display:grid;grid-template-columns:64px 1fr;gap:10px}
.tile{width:64px;height:64px;border-radius:6px;background:#2d2d33;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1}
.tile.sm{width:52px;height:52px;font-size:28px}
.pmeta{font-size:12px;color:var(--sub);word-break:break-word}
.pmeta .t1{color:var(--ink);font-weight:700}
.idb{color:var(--sub)}.idb b{color:var(--yellow);font-weight:400}
.ubadge{border:1px solid #66666e;color:var(--sub);font-size:10px;padding:0 3px;border-radius:3px}
.ca{font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:baseline;margin:3px 0;min-width:0}
.ca code{color:var(--lilac);word-break:break-all;min-width:0;flex:1}
.lnk{color:var(--sub);cursor:pointer;background:none;border:0;padding:0;font-size:11px;flex:0 0 auto}
.lnk:hover,.lnk.ok{color:var(--green)}
.body{margin:4px 0;font-size:13px}
.gt{color:var(--green);font-size:12.5px;margin:1px 0}
.chk{font-size:12px;margin:1px 0}
.reply{background:var(--panel2);border-radius:6px;padding:7px 9px;margin:8px 0 0 14px;font-size:12px}
.reply .q{color:var(--red)}
.more{display:inline-block;margin-top:6px;color:var(--lilac);cursor:pointer;font-size:12px}
.foot{display:flex;align-items:stretch;font-size:12px;margin:10px -12px -12px;border-top:1px solid var(--line)}
.foot b{background:var(--lilacbg);color:#111;font-weight:600;padding:5px 10px}
.foot span{padding:5px 10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot em{font-style:normal;background:#3a3a40;padding:5px 8px;margin:3px;border-radius:3px;white-space:nowrap}
/* coins */
.ccard{background:var(--panel2);border-radius:8px;padding:10px 10px 0;margin-bottom:9px;overflow:hidden;cursor:pointer}
.ccard .row1{display:grid;grid-template-columns:52px 1fr;gap:10px}
.cname{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cname .tk{color:var(--yellow);font-weight:700}
.cname .mc{font-weight:700;white-space:nowrap}
.cblurb{color:var(--sub);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0}
.cmeta{font-size:12px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}
.cmeta b{color:var(--ink);font-weight:600}
.pbar{height:3px;background:#3a3a40;margin:8px -10px 0}.pbar i{display:block;height:100%;background:var(--green)}
.sorts{display:inline-flex;background:var(--panel2);border-radius:6px;padding:2px;gap:2px}
.sorts button{border:0;background:none;color:var(--ink);font-size:12px;padding:2px 7px;border-radius:4px;cursor:pointer}
.sorts button.on{background:var(--green);color:#111}
.badge{font-size:10px;border-radius:3px;padding:0 4px;margin-left:4px;border:1px solid;font-weight:600;vertical-align:1px}
.b-alive{color:var(--green)}.b-dead{color:var(--sub)}.b-rugged{color:var(--red)}.b-risk{color:var(--red)}.b-new{color:var(--yellow)}
.pos{color:var(--green)}.neg{color:var(--red)}
/* topics */
.trow{padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.trow:first-of-type{border-top:0}
.trow .l1{display:flex;justify-content:space-between;gap:8px}
.trow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .sc{white-space:nowrap}
.grid{display:flex;gap:3px;flex:0 0 auto}
.grid i{width:12px;height:12px;border-radius:2px;background:#2f2f35;display:block}
.g1{background:#3d4a2c!important}.g2{background:#5b7a36!important}.g3{background:#7fae45!important}.g4{background:#a3d977!important}.g5{background:#d4f5a8!important}
.gp{outline:1px dashed #888;outline-offset:-1px}
.retired{opacity:.45}
/* live line */
.live{font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:center;margin:8px 0 0}
.live .ld{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block}
.live.on .ld{background:var(--green);box-shadow:0 0 0 3px rgba(163,217,119,.18)}
/* mdxcn figures: official fenced ASCII in <pre>; frame is the text */
.fig{font:clamp(9.5px,calc((100vw - 70px) / 31.4),12px)/1.32 var(--mono);font-variant-numeric:tabular-nums;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:6px 0 8px;padding:0;color:#d6d6da;background:transparent}
.figlead{font-size:12px;color:var(--sub);margin:2px 0 0}
/* detail sheet */
.sheet{position:fixed;inset:0;background:rgba(20,14,60,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panelx{background:var(--panel);width:100%;max-width:640px;max-height:90vh;overflow:auto;overflow-x:hidden;border-radius:12px 12px 0 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom))}
.close{float:right;border:0;background:var(--lilacbg);color:#111;border-radius:6px;width:30px;height:28px;font-size:14px;cursor:pointer}
.box{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.verdict{padding:7px 9px;border-radius:6px;margin:8px 0;font-size:12.5px;border-left:3px solid}
.s-up{border-color:var(--green);background:rgba(163,217,119,.08)}.s-risk{border-color:var(--red);background:rgba(240,113,120,.08)}
.s-watch{border-color:var(--yellow);background:rgba(242,212,92,.07)}.s-info{border-color:var(--lilac);background:rgba(180,167,245,.08)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:12px;margin:3px 0}.kv .k{color:var(--sub)}
ul.src{list-style:none;padding:0;margin:4px 0 0}ul.src li{padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.sum{padding-left:18px;margin:6px 0}.sum li{margin:4px 0}
.btn{display:inline-block;border:0;background:var(--lilacbg);color:#111;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--lilacbg);color:#111;padding:6px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;font-size:11px;color:#2a2350;margin-top:12px}
</style>
</head>
<body>
<header>
  <div class="top"><div class="ticker">$ALPHA <i>—</i> 🍀</div><div class="upd">upd <b id="upd"></b><span class="dots"><i style="background:var(--lilac)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i></span></div></div>
  <nav class="tabs">
    <button class="tab on" data-p="desk">desk</button>
    <button class="tab" data-p="coins">coins</button>
    <button class="tab" data-p="topics">topics</button>
    <button class="tab" data-p="feed">feed</button>
    <button class="tab" data-p="rank">rank</button>
    <button class="tab" data-p="musk">musk</button>
    <button class="tab" data-p="export">export</button>
  </nav>
</header>
<main>
  <section class="panel on" id="p-desk"></section>
  <section class="panel" id="p-coins"></section>
  <section class="panel" id="p-topics"></section>
  <section class="panel" id="p-feed"></section>
  <section class="panel" id="p-rank"></section>
  <section class="panel" id="p-musk"></section>
  <section class="panel" id="p-export"></section>
  <footer id="foot"></footer>
</main>
<div class="sheet" id="sheet"><div class="panelx" id="detail"></div></div>
<div class="toast" id="toast"></div>
<script id="embedded" type="application/json">/*DATA*/</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow=t=>t==="up"?'<span class="g">▲升温</span>':t==="down"?'<span class="sub">▼降温</span>':'<span class="dim">●持平</span>';
const lvl=g=>g>=80?5:g>=65?4:g>=50?3:g>=35?2:g>=20?1:0;
const fmt=n=>n>=1e4?(n/1e4).toFixed(n>=1e5?0:1)+"万":String(n);
let D;
function days(t){return Object.keys(t.history||{}).sort().slice(-7)}
function gridHTML(t){return `<div class="grid">${days(t).map(d=>{const h=t.history[d];return `<i class="g${lvl(h.grid)}${h.partial_hours?" gp":""}" title="${d} 约${h.est}帖"></i>`}).join("")}</div>`}
const figHTML=s=>s?`<pre class="fig">${esc(String(s).split("\n").filter(l=>!/^```/.test(l)).join("\n"))}</pre>`:"";
// thin vertical-bar meter: n bars, frac filled
function vbar(frac,n=40,cls=""){const f=Math.round(Math.max(0,Math.min(1,frac||0))*n);return `<div class="vb ${cls}">${Array.from({length:n},(_,i)=>`<i class="${i<f?"f":""}"></i>`).join("")}</div>`}
const meter=(k,frac,v,cls="")=>`<div class="meter"><span class="k">${k}</span>${vbar(frac,40,cls)}<span class="v">${v}</span></div>`;
const LV={};let liveAt=null,liveOK=false;
const money=v=>v==null||isNaN(v)?"—":v>=1e9?"$"+(v/1e9).toFixed(2)+"b":v>=1e6?"$"+(v/1e6).toFixed(v>=1e8?0:1)+"m":v>=1e3?"$"+(v/1e3).toFixed(1)+"k":"$"+Math.round(v);
const pct=v=>v==null||isNaN(v)?"—":(v>0?"+":"")+(Math.abs(v)>=1000?Math.round(v).toLocaleString():Number(v).toFixed(Math.abs(v)>=100?0:1))+"%";
const pc=v=>v==null||isNaN(v)?"":v>0?"pos":v<0?"neg":"";
const gmLink=c=>`https://gmgn.ai/${c.chain}/token/${c.ca}`;
const key=ca=>/^0x/i.test(ca)?ca.toLowerCase():ca;
function vals(c){const s=c.snap||{},l=LV[key(c.ca)];return l?{mcap:l.mcap,h1:l.h1,h6:l.h6,h24:l.h24,liq:l.liq,src:"live"}:{mcap:s.mcap,h1:s.chg1h,h6:s.chg6h,h24:s.chg24h,liq:s.liq,src:"snap"}}
const ST={alive:["存活","b-alive"],dead:["已死","b-dead"],rugged:["跑路","b-rugged"]};
function risky(c){const s=c.snap||{};const r=[...(s.flags||[])];if((s.bundler||0)>=40)r.push("捆绑"+s.bundler+"%");if((s.top10||0)>=60)r.push("前十"+s.top10+"%");return r}
const isNew=c=>c.snap&&c.snap.created&&(Date.now()/1000-c.snap.created)<86400;
function ageTxt(ts){if(!ts)return"";const h=(Date.now()/1000-ts)/3600;return h<1?Math.round(h*60)+"m":h<48?Math.round(h)+"h":Math.round(h/24)+"d"}
const hid=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h};
const pid=s=>hid(s).toString(16).padStart(6,"0").slice(-6);          // short post id
const pno=s=>1000+hid("no"+s)%9000;                                   // post number
const tsyd=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleString("en-GB",{timeZone:"Australia/Sydney",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).replace(",","")};
const L=(c,f)=>`data-lv="${f}" data-ca="${key(c.ca)}"`;
const caRow=c=>`<div class="ca">CA <code>${esc(c.ca)}</code><button class="lnk cpy" data-copy="${esc(c.ca)}">copy</button><a class="lnk" href="${gmLink(c)}" target="_blank" rel="noopener">gmgn↗</a></div>`;
// full coin block (detail sheet)
function coinBlock(c,role){
  const v=vals(c),st=ST[c.status]||ST.alive,rk=risky(c),s=c.snap||{};
  return `<div class="thread" style="padding:8px 0"><div class="pmeta"><span class="y" style="font-weight:700">${role==="leader"?"👑 ":""}$${esc(c.sym)}</span> <span class="ubadge">${esc(c.chain.toUpperCase())}</span><span class="badge ${st[1]}">${st[0]}</span>${isNew(c)?'<span class="badge b-new">🆕24h</span>':""}${c.auto?'<span class="badge b-new">自动发现</span>':""}${rk.length?`<span class="badge b-risk">⚠ ${esc(rk.join(" · "))}</span>`:""}</div>
   <div class="cmeta" style="margin-top:3px">mc <b ${L(c,"mcap")}>${money(v.mcap)}</b> 1h <b class="${pc(v.h1)}" ${L(c,"h1")}>${pct(v.h1)}</b> 24h <b class="${pc(v.h24)}" ${L(c,"h24")}>${pct(v.h24)}</b> liq <b ${L(c,"liq")}>${money(v.liq)}</b></div>
   <div class="cblurb" style="-webkit-line-clamp:4">${esc(c.blurb||"")}</div>
   <div class="cmeta">持有人 ${s.holders??"—"} · 前十 ${s.top10??"—"}% · ATH ${money(s.ath_mcap)}</div>${caRow(c)}</div>`}
function coinsHTML(t){return (t.coins||[]).map((c,i)=>coinBlock(c,i===0?"leader":"beta")).join("")+(t.memes||[]).map(m=>`<div class="gt">&gt;梗（无币）：${esc(m)}</div>`).join("")||'<div class="sub">暂无链上币</div>'}
// coin card (coins tab)
function ccard(c,t){
  const v=vals(c),s=c.snap||{},st=ST[c.status]||ST.alive,rk=risky(c);
  const prog=Math.max(3,Math.min(100,s.mom??(s.ath_mcap?100*(v.mcap||0)/s.ath_mcap:30)));
  return `<div class="ccard" data-open="${t?t.id:""}"><div class="row1"><div class="tile sm">${t?t.emoji:"🆕"}</div><div style="min-width:0">
   <div class="cname"><span><span class="tk">$${esc(c.sym)}</span> <span class="sub">${ageTxt(s.created)}${t?` · ${esc(t.name.split(" ")[0])}`:""}</span></span><span class="mc" ${L(c,"mcap")}>${money(v.mcap)}</span></div>
   <div class="cblurb">${esc(c.blurb||c.name||"")}</div>
   <div class="cmeta"><span>1h <b class="${pc(v.h1)}" ${L(c,"h1")}>${pct(v.h1)}</b></span><span>24h <b class="${pc(v.h24)}" ${L(c,"h24")}>${pct(v.h24)}</b></span><span>liq <b ${L(c,"liq")}>${money(v.liq)}</b></span><span class="${st[1]}">${st[0]}</span>${rk.length?`<span class="r">⚠${esc(rk[0])}</span>`:""}</div>
   ${caRow(c)}</div></div><div class="pbar"><i style="width:${prog}%"></i></div></div>`}
function setLive(){document.querySelectorAll(".livebar").forEach(el=>{el.classList.toggle("on",liveOK);
  el.innerHTML=`<span class="ld"></span>${liveOK?`live ${liveAt.toLocaleTimeString("en-GB",{timeZone:"Australia/Sydney",hour12:false})} 悉尼 · dexscreener · 60s`:`snapshot ${esc(D.meta.prices_label||D.meta.updated_label)} · 实时行情获取中/失败时显示 GMGN 快照`}`})}
function applyLive(){document.querySelectorAll("[data-lv]").forEach(e=>{const l=LV[e.dataset.ca];if(!l)return;const f=e.dataset.lv,v=l[f];if(v==null)return;
  if(f==="mcap"||f==="liq")e.textContent=money(v);else{e.textContent=pct(v);e.classList.remove("pos","neg");pc(v)&&e.classList.add(pc(v))}});setLive();liveMeter()}
async function live(){
  const cas=[...new Set([...D.topics.flatMap(t=>(t.coins||[]).map(c=>c.ca)),...(D.radar||[]).map(r=>r.ca)].filter(Boolean))];
  let got=0;
  for(let i=0;i<cas.length;i+=30){
    try{const r=await fetch("https://api.dexscreener.com/latest/dex/tokens/"+cas.slice(i,i+30).join(","));if(!r.ok)continue;const j=await r.json();
      const best={};(j.pairs||[]).forEach(p=>{const k=key(p.baseToken.address);if(!cas.some(c=>key(c)===k))return;if(!best[k]||(p.liquidity?.usd||0)>(best[k].liquidity?.usd||0))best[k]=p});
      for(const k in best){const p=best[k];LV[k]={mcap:p.marketCap??p.fdv,h1:p.priceChange?.h1,h6:p.priceChange?.h6,h24:p.priceChange?.h24,liq:p.liquidity?.usd};got++}
    }catch(e){}
  }
  if(got){liveOK=true;liveAt=new Date()}
  applyLive();
}

  D.topics.forEach(t=>(t.sources||[]).forEach(s=>{if(!seen.has(s.url)){seen.add(s.url);posts.push({时间_悉尼:"",作者:"",内容:s.label,链接:s.url,主题:t.name,热度:"",浏览量:""})}}));
  const ds=[...new Set(D.topics.flatMap(t=>Object.keys(t.history||{})))].sort();
  const heat=D.topics.slice().sort((a,b)=>b.heat-a.heat).map(t=>{const o={排名:t.rank??"",话题:t.name,状态:t.status,热度:t.heat,趋势:{up:"↑",down:"↓"}[t.trend]||"→",龙头:t.leader.sym,结论:t.verdict};ds.forEach(x=>o[x.slice(5)+"帖数"]=t.history[x]?.est??"");return o});
  const coins=D.topics.flatMap(t=>(t.coins||[]).map((c,i)=>{const v=vals(c);return {话题:t.name,周期:t.horizon==="24h"?"24小时":"大周期",角色:i?"beta":"龙头",代币:c.sym,链:c.chain,CA:c.ca,状态:c.status,市值:Math.round(v.mcap||0),"1h%":v.h1,"24h%":v.h24,流动性:Math.round(v.liq||0),叙事:c.blurb,GMGN:gmLink(c)}}));
  return {posts,heat,coins};
}
function doExport(){
  const {posts,heat,coins}=sheets(),name="alpha_"+D.meta.updated.slice(0,10);
  if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(posts),"帖子与来源");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(heat),"话题热度");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(coins),"代币");XLSX.writeFile(wb,name+".xlsx");return}
  const csv=rows=>{const k=Object.keys(rows[0]);return [k.join(",")].concat(rows.map(o=>k.map(x=>'"'+String(o[x]??"").replace(/"/g,'""')+'"').join(","))).join("\n")};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv(posts)+"\n\n"+csv(heat)+"\n\n"+csv(coins)],{type:"text/csv"}));a.download=name+".csv";a.click();
}
const emb=JSON.parse($("#embedded").textContent);render(emb);
const legacy={h24:"desk",home:"topics",lead:"coins",hist:"feed"};
{let h=location.hash.slice(1);h=legacy[h]||h;const b=h&&document.querySelector(`.tab[data-p="${h}"]`);if(b)b.click();else if(h.startsWith("t=")&&D.topics.some(x=>x.id===h.slice(2)))detail(h.slice(2))}
fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.version>=3&&((d.meta.prices_updated||"")>(emb.meta.prices_updated||"")||d.meta.updated>emb.meta.updated)){const cur=document.querySelector(".tab.on");render(d);cur&&cur.click()}}).catch(()=>{}).finally(()=>{live();setInterval(live,60000)});
</script>
