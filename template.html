<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1f">
<title>$ALPHA 雷达 · 沐珩</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* design system (from memechan refs)
   type: 22px lilac board title · 15px bold yellow ticker · 14px bold white headline · 13px body · 11.5px grey meta (min 11px)
   color: yellow=ids/tickers/highlights · green=greentext/+%/bars · red=-%/risk · lilac=active tab/links · grey=time/meta · white=primary
   space: one fact per line, 1px #333 separators, no decoration */
:root{--bg:#8b80d9;--panel:#1c1c1f;--panel2:#26262b;--line:#333338;--ink:#ececee;--sub:#8e8e96;--dim:#6a6a72;
--yellow:#f2d45c;--lilac:#b4a7f5;--lilacbg:#a99cf0;--green:#a3d977;--red:#f07178;
--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:13px/1.6 var(--mono);overflow-x:hidden;
 background:var(--bg) radial-gradient(rgba(255,255,255,.2) 1px,transparent 1.2px) 0 0/14px 14px}
a{color:var(--lilac);text-decoration:none}
button{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--panel);padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticker{font-weight:700;font-size:13px}.ticker i{font-style:normal;color:var(--lilac)}
.upd{font-size:11px;color:var(--sub);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:8px}
.tab{flex:0 0 auto;padding:3px 9px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:13px;cursor:pointer}
.tab.on{background:var(--lilacbg);color:#111}
main{max-width:640px;margin:0 auto;padding:10px 8px 30px}
.term{background:var(--panel);border-radius:10px;padding:14px 12px;margin-bottom:10px;overflow:hidden}
.panel{display:none}.panel.on{display:block}
.sub{color:var(--sub)}.dim{color:var(--dim)}.y{color:var(--yellow)}.l{color:var(--lilac)}.g{color:var(--green)}.r{color:var(--red)}
.pos{color:var(--green)}.neg{color:var(--red)}
.sec{color:var(--green);font-weight:700;font-size:13px}
.secsub{color:var(--sub);font-size:11.5px;margin:0 0 10px}
/* meters */
.meter{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;font-size:12px;line-height:1.9}
.meter .k{color:var(--sub);white-space:nowrap}.meter .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.vb{display:flex;gap:1.5px;overflow:hidden;height:12px}
.vb i{flex:1 1 0;min-width:1px;max-width:3px;background:#55555c;border-radius:1px}
.vb i.f{background:var(--yellow)}
/* table */
table.tt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.tt th{background:var(--yellow);color:#111;text-align:left;font-weight:600;padding:4px 8px}
.tt td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .n{text-align:right;font-variant-numeric:tabular-nums}
/* event log */
.ev{display:grid;grid-template-columns:44px 54px 1fr;gap:0 8px;padding:5px 0;font-size:12px;align-items:baseline}
.ev .t{color:var(--dim);font-variant-numeric:tabular-nums}
.ev .tag{font-weight:700;font-size:11px;text-align:center;border-radius:3px}
.tag.ALERT{background:var(--lilacbg);color:#111}.tag.NEW{color:var(--green)}.tag.DEL{color:var(--red)}.tag.VERIFY{color:var(--yellow)}
.ev .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .d{grid-column:3;color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{color:var(--sub);font-size:11px;padding:8px 0 2px;border-top:1px solid var(--line);margin-top:4px}
/* desk board */
.boardh{text-align:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.boardh h1{color:var(--lilac);font-size:22px;margin:0 0 2px;font-weight:700}
.boardh div{color:var(--sub);font-size:11.5px}
.alert{color:var(--yellow);font-size:12.5px;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post{padding:14px 0;border-bottom:1px solid var(--line)}
.post:last-of-type{border-bottom:0}
.ph{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;cursor:pointer}
.tile{width:48px;height:48px;border-radius:6px;background:#2d2d33;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
.hl{font-weight:700;font-size:14px;line-height:1.35}
.tk{color:var(--yellow);font-weight:700;font-size:15px}
.meta{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink);font-weight:600}
.vf{font-size:12px;margin:8px 0 4px;color:var(--sub)}
.gt{color:var(--green);font-size:12.5px;line-height:1.55;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel{font-size:12px;margin-top:6px;color:var(--sub)}.rel span{margin-right:10px;white-space:nowrap}
.ca{font-size:11.5px;color:var(--sub);display:flex;gap:10px;align-items:baseline;margin-top:4px}
.ca code{color:var(--lilac);font-family:inherit}
.lnk{color:var(--sub);cursor:pointer;background:none;border:0;padding:0;font-size:11.5px}
.lnk.ok{color:var(--green)}
.foot{display:flex;align-items:stretch;font-size:12px;margin:12px -12px -14px;border-top:1px solid var(--line)}
.foot b{background:var(--lilacbg);color:#111;font-weight:600;padding:5px 10px}
.foot span{padding:5px 10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot em{font-style:normal;background:#3a3a40;padding:2px 8px;margin:3px 3px 3px 0;border-radius:3px;white-space:nowrap}
/* coins */
.ccard{background:var(--panel2);border-radius:8px;padding:10px 10px 0;margin-bottom:8px;overflow:hidden;cursor:pointer}
.ccard .row1{display:grid;grid-template-columns:56px 1fr;gap:10px}
.ccard .tile{width:56px;height:56px;font-size:30px}
.cname{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cname .mc{font-weight:700;white-space:nowrap;font-size:13.5px}
.cblurb{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11.5px;color:var(--sub);display:flex;gap:12px;white-space:nowrap}
.cmeta b{color:var(--ink);font-weight:600}
.pbar{height:3px;background:#3a3a40;margin:10px -10px 0}.pbar i{display:block;height:100%;background:var(--green)}
.sorts{display:inline-flex;background:var(--panel2);border-radius:6px;padding:2px;gap:2px}
.sorts button{border:0;background:none;color:var(--ink);font-size:12px;padding:1px 7px;border-radius:4px;cursor:pointer}
.sorts button.on{background:var(--green);color:#111}
/* topics */
.trow{padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.trow:first-child{border-top:0;padding-top:0}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nm{font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:flex;gap:3px;flex:0 0 auto}
.grid i{width:13px;height:13px;border-radius:2px;background:#2f2f35;display:block}
.g1{background:#3d4a2c!important}.g2{background:#5b7a36!important}.g3{background:#7fae45!important}.g4{background:#a3d977!important}.g5{background:#d4f5a8!important}
.gp{opacity:.6}
.retired{opacity:.5;font-size:12px;padding:6px 0}
.live{font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:center;margin-top:10px}
.live .ld{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block}
.live.on .ld{background:var(--green)}
/* detail sheet */
.sheet{position:fixed;inset:0;background:rgba(20,14,60,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panelx{background:var(--panel);width:100%;max-width:640px;max-height:90vh;overflow:auto;overflow-x:hidden;border-radius:12px 12px 0 0;padding:16px 12px calc(20px + env(safe-area-inset-bottom))}
.close{float:right;border:0;background:var(--lilacbg);color:#111;border-radius:6px;width:30px;height:28px;font-size:14px;cursor:pointer}
.box{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.box>.sec{margin-bottom:6px}
.verdict{font-size:13px;margin:10px 0 0;padding-left:9px;border-left:3px solid}
.s-up{border-color:var(--green)}.s-risk{border-color:var(--red)}.s-watch{border-color:var(--yellow)}.s-info{border-color:var(--lilac)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:12px;margin:4px 0}.kv .k{color:var(--sub)}
ul.src{list-style:none;padding:0;margin:0}ul.src li{padding:6px 0;border-top:1px solid var(--line);font-size:12px}ul.src li:first-child{border-top:0}
details summary{cursor:pointer;color:var(--lilac);font-size:12px}
.fig{font:11px/1.3 var(--mono);white-space:pre;overflow-x:auto;margin:6px 0;color:#d6d6da}
.wk{display:flex;gap:6px;margin-top:4px}.wk div{text-align:center;font-size:11px;color:var(--sub)}.wk i{display:block;width:30px;height:22px;border-radius:3px;background:#2f2f35;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--lilacbg);color:#111;padding:6px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
footer{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:4px}
footer a,footer button{color:#1f1846;background:none;border:0;padding:4px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="top"><div class="ticker">$ALPHA <i>—</i> 🍀</div><div class="upd" id="upd"></div></div>
  <nav class="tabs">
    <button class="tab on" data-p="desk">desk</button>
    <button class="tab" data-p="coins">coins</button>
    <button class="tab" data-p="topics">topics</button>
    <button class="tab" data-p="feed">feed</button>
    <button class="tab" data-p="rank">rank</button>
  </nav>
</header>
<main>
  <section class="panel on" id="p-desk"></section>
  <section class="panel" id="p-coins"></section>
  <section class="panel" id="p-topics"></section>
  <section class="panel" id="p-feed"></section>
  <section class="panel" id="p-rank"></section>
  <footer><button id="xl">⬇ 导出 Excel</button><a href="data.json" target="_blank">data.json</a><a href="posts.xlsx">posts.xlsx</a></footer>
</main>
<div class="sheet" id="sheet"><div class="panelx" id="detail"></div></div>
<div class="toast" id="toast"></div>
<script id="embedded" type="application/json">/*DATA*/</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow=t=>t==="up"?'<span class="g">▲</span>':t==="down"?'<span class="r">▼</span>':'<span class="dim">–</span>';
const lvl=g=>g>=80?5:g>=65?4:g>=50?3:g>=35?2:g>=20?1:0;
const fmt=n=>n>=1e4?(n/1e4).toFixed(n>=1e5?0:1)+"万":String(n);
let D;
function days(t){return Object.keys(t.history||{}).sort().slice(-7)}
function gridHTML(t){return `<div class="grid">${days(t).map(d=>{const h=t.history[d];return `<i class="g${lvl(h.grid)}${h.partial_hours?" gp":""}" title="${d} 约${h.est}帖"></i>`}).join("")}</div>`}
const figHTML=s=>s?`<pre class="fig">${esc(String(s).split("\n").filter(l=>!/^```/.test(l)).join("\n"))}</pre>`:"";
function vbar(frac,n=36){const f=Math.round(Math.max(0,Math.min(1,frac||0))*n);return `<div class="vb">${Array.from({length:n},(_,i)=>`<i class="${i<f?"f":""}"></i>`).join("")}</div>`}
const meter=(k,frac,v)=>`<div class="meter"><span class="k">${k}</span>${vbar(frac)}<span class="v">${v}</span></div>`;
const LV={};let liveAt=null,liveOK=false;
const money=v=>v==null||isNaN(v)?"—":v>=1e9?"$"+(v/1e9).toFixed(2)+"b":v>=1e6?"$"+(v/1e6).toFixed(v>=1e8?0:1)+"m":v>=1e3?"$"+(v/1e3).toFixed(1)+"k":"$"+Math.round(v);
const pct=v=>v==null||isNaN(v)?"—":(v>0?"+":"")+(Math.abs(v)>=1000?Math.round(v).toLocaleString():Number(v).toFixed(Math.abs(v)>=100?0:1))+"%";
const pc=v=>v==null||isNaN(v)?"":v>0?"pos":v<0?"neg":"";
const gmLink=c=>`https://gmgn.ai/${c.chain}/token/${c.ca}`;
const key=ca=>/^0x/i.test(ca)?ca.toLowerCase():ca;
function vals(c){const s=c.snap||{},l=LV[key(c.ca)];return l?{mcap:l.mcap,h1:l.h1,h24:l.h24,liq:l.liq,vol:l.vol,src:"live"}:{mcap:s.mcap,h1:s.chg1h,h24:s.chg24h,liq:s.liq,vol:s.vol24h,src:"snap"}}
function risky(c){const s=c.snap||{};const r=[...(s.flags||[])];if((s.bundler||0)>=40)r.push("捆绑"+Math.round(s.bundler)+"%");if((s.top10||0)>=60)r.push("前十"+Math.round(s.top10)+"%");return r}
function ageTxt(ts){if(!ts)return"";const h=(Date.now()/1000-ts)/3600;return h<1?Math.round(h*60)+"m":h<48?Math.round(h)+"h":Math.round(h/24)+"d"}
const tsyd=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleString("en-GB",{timeZone:"Australia/Sydney",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).replace(",","")};
const L=(c,f)=>`data-lv="${f}" data-ca="${key(c.ca)}"`;
const shortCA=ca=>ca.length>14?ca.slice(0,6)+"…"+ca.slice(-4):ca;
const caRow=c=>`<div class="ca">CA <code>${esc(shortCA(c.ca))}</code><button class="lnk cpy" data-copy="${esc(c.ca)}">copy</button><a class="lnk" href="${gmLink(c)}" target="_blank" rel="noopener">gmgn↗</a></div>`;
const tname=t=>t.name.split(" · ")[0];
// coin card
function ccard(c,t){
  const v=vals(c),s=c.snap||{},rk=risky(c),dead=c.status&&c.status!=="alive";
  const prog=Math.max(3,Math.min(100,s.mom??(s.ath_mcap?100*(v.mcap||0)/s.ath_mcap:30)));
  return `<div class="ccard" data-open="${t?t.id:""}"><div class="row1"><div class="tile">${t?t.emoji:"🆕"}</div><div style="min-width:0">
   <div class="cname"><span><span class="tk">$${esc(c.sym)}</span> <span class="sub" style="font-size:11.5px">${ageTxt(s.created)}</span></span><span class="mc" ${L(c,"mcap")}>${money(v.mcap)}</span></div>
   <div class="cblurb">${esc(c.blurb||c.name||"")}</div>
   <div class="cmeta"><span>1h <b class="${pc(v.h1)}" ${L(c,"h1")}>${pct(v.h1)}</b></span><span>vol <b ${L(c,"vol")}>${money(v.vol)}</b></span><span>${c.snap&&!dead?"✅":"❌"}${dead?' <span class="r">已死</span>':rk.length?' <span class="r">'+esc(rk[0])+'</span>':""}</span></div>
   ${caRow(c)}</div></div><div class="pbar"><i style="width:${prog}%"></i></div></div>`}
function setLive(){document.querySelectorAll(".livebar").forEach(el=>{el.classList.toggle("on",liveOK);
  el.innerHTML=`<span class="ld"></span>${liveOK?`live ${liveAt.toLocaleTimeString("en-GB",{timeZone:"Australia/Sydney",hour12:false,hour:"2-digit",minute:"2-digit"})} 悉尼 · dexscreener 60s`:`快照 ${esc(D.meta.prices_label||D.meta.updated_label)} · 实时价加载中`}`})}
function applyLive(){document.querySelectorAll("[data-lv]").forEach(e=>{const l=LV[e.dataset.ca];if(!l)return;const f=e.dataset.lv,v=l[f];if(v==null)return;
  if(f==="mcap"||f==="liq"||f==="vol")e.textContent=money(v);else{e.textContent=pct(v);e.classList.remove("pos","neg");pc(v)&&e.classList.add(pc(v))}});setLive();liveMeter()}
async function live(){
  const cas=[...new Set([...D.topics.flatMap(t=>(t.coins||[]).map(c=>c.ca)),...(D.radar||[]).map(r=>r.ca)].filter(Boolean))];
  let got=0;
  for(let i=0;i<cas.length;i+=30){
    try{const r=await fetch("https://api.dexscreener.com/latest/dex/tokens/"+cas.slice(i,i+30).join(","));if(!r.ok)continue;const j=await r.json();
      const best={};(j.pairs||[]).forEach(p=>{const k=key(p.baseToken.address);if(!cas.some(c=>key(c)===k))return;if(!best[k]||(p.liquidity?.usd||0)>(best[k].liquidity?.usd||0))best[k]=p});
      for(const k in best){const p=best[k];LV[k]={mcap:p.marketCap??p.fdv,h1:p.priceChange?.h1,h24:p.priceChange?.h24,liq:p.liquidity?.usd,vol:p.volume?.h24};got++}
    }catch(e){}
  }
  if(got){liveOK=true;liveAt=new Date()}
  applyLive();
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1300)}
document.addEventListener("click",e=>{const b=e.target.closest(".cpy");if(b){e.stopPropagation();e.preventDefault();const s=b.dataset.copy;
  const done=()=>{b.classList.add("ok");b.textContent="copied";toast("已复制 CA");setTimeout(()=>{b.classList.remove("ok");b.textContent="copy"},1200)};
  if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(s).then(done,()=>fb());else fb();
  function fb(){const a=document.createElement("textarea");a.value=s;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(_){prompt("复制 CA",s)}a.remove()}
  return}
 if(e.target.closest("a,details"))return;
 const o=e.target.closest("[data-open]");if(o&&o.dataset.open)detail(o.dataset.open)});
// ---------- detail sheet ----------
function detail(id){
  const t=D.topics.find(x=>x.id===id);if(!t)return;const a=t.attention||{notes:[]},F=t.figures||{};
  const figs=[F.trend,F.coins,F.attention].filter(Boolean);
  $("#detail").innerHTML=`<button class="close" onclick="closeD()">✕</button>
   <div class="hl" style="font-size:15px">${t.emoji} ${esc(t.name)}</div>
   <div class="meta">热度 <b class="y">${t.heat}</b> ${arrow(t.trend)} ${t.delta>0?"+":""}${t.delta}% · ${t.horizon==="24h"?"24小时":"大周期"}</div>
   <div class="verdict s-${t.signal}">${esc(t.verdict)}</div>
   <div class="box"><div class="sec">7 日热度</div><div class="wk">${days(t).map(d=>{const h=t.history[d];return `<div><i class="g${lvl(h.grid)}"></i>${d.slice(8)}</div>`}).join("")}</div></div>
   <div class="box"><div class="sec">龙头 & Beta</div>${(t.coins||[]).map(c=>ccard(c,t)).join("")||'<div class="sub">暂无链上币</div>'}<div class="live livebar"></div></div>
   <div class="box"><div class="sec">打法</div>${(t.play||[]).map(p=>`<div class="gt" style="-webkit-line-clamp:4">&gt;${esc(p)}</div>`).join("")}
    ${t.ignition?`<div class="gt" style="color:var(--yellow);-webkit-line-clamp:4">&gt;点火：${esc(t.ignition)}</div>`:""}<div class="r" style="font-size:12px;margin-top:6px">风险：${esc(t.risk||"")}</div></div>
   <div class="box"><div class="sec">注意力</div>${["大人物","政治/慈善","新闻","新鲜感"].map((k,i)=>a.notes[i]?`<div class="kv"><span class="k">${k}</span><span>${esc(a.notes[i])}</span></div>`:"").join("")}</div>
   <div class="box"><div class="sec">来源</div><ul class="src">${(t.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a></li>`).join("")}</ul></div>
   ${figs.length?`<div class="box"><details><summary>图表</summary>${figs.map(figHTML).join("")}</details></div>`:""}`;
  $("#sheet").classList.add("on");$("#detail").scrollTop=0;setLive();applyLive();
}
function closeD(){$("#sheet").classList.remove("on")}
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeD()};
// ---------- meters (feed) ----------
function deskMeters(){
  const d=D,now=new Date(),today=now.toLocaleDateString("en-CA",{timeZone:"Australia/Sydney"});
  const scans=(d.meta.scan_log||[]).filter(x=>x.slice(0,10)===today).length;
  const act=d.topics.filter(t=>t.status==="active");
  const coins=act.flatMap(t=>t.coins||[]).filter(c=>c.ca);
  const liveN=coins.filter(c=>LV[key(c.ca)]).length,alive=coins.filter(c=>c.status==="alive").length;
  const age=Math.max(0,(now-new Date(d.meta.prices_updated||d.meta.updated))/60000);
  return meter("今日扫描",scans/24,`${scans}`)+meter("跟踪话题",act.length/20,`${act.length}`)
   +meter("实时币价",(liveN||alive)/Math.max(coins.length,1),`${liveOK?liveN:alive}/${coins.length}`)
   +meter("数据更新",1-Math.min(age,120)/120,`${age<60?Math.round(age)+"m":Math.round(age/60)+"h"}前`)}
function liveMeter(){const m=$("#meters");if(m&&D)m.innerHTML=deskMeters()}
function feedItems(d){
  const out=[];
  (d.history||[]).forEach(h=>out.push({t:h.time,tag:/删除|归零|rug|跑路/.test(h.title)?"DEL":/新|升入/.test(h.title)?"NEW":"ALERT",m:h.title,dsc:h.verdict}));
  (d.radar||[]).forEach(r=>out.push({t:tsyd(r.first_seen),tag:"NEW",m:`<span class="y">$${esc(r.sym)}</span> ${money(r.mcap)} <span class="${pc(r.chg1h)}">${pct(r.chg1h)}</span>`,raw:1,dsc:"GMGN 热榜新币 · 叙事未核实"}));
  (d.pruned||[]).forEach(p=>out.push({t:p.date,tag:"DEL",m:`<span class="y">$${esc(p.sym)}</span> ${esc(p.reason)}`,raw:1}));
  d.topics.filter(t=>t.status==="active").forEach(t=>{const c=(t.coins||[])[0];if(c&&c.snap&&c.snap.at)out.push({t:tsyd(c.snap.at),tag:"VERIFY",m:`<span class="y">$${esc(c.sym)}</span> ${c.status==="alive"?"✅":"❌"} ${money(c.snap.mcap)}`,raw:1})});
  return out.filter(x=>x.t).sort((a,b)=>b.t.localeCompare(a.t));
}
const evHTML=x=>`<div class="ev"><span class="t">${esc(x.t.slice(-5))}</span><span class="tag ${x.tag}">${x.tag}</span><span class="m">${x.raw?x.m:esc(x.m)}</span>${x.dsc?`<span class="d">└ ${esc(x.dsc)}</span>`:""}</div>`;
function feedLog(items){let last="",h="";items.forEach(x=>{const day=x.t.slice(0,5);if(day!==last){h+=`<div class="day">${day}</div>`;last=day}h+=evHTML(x)});return h}
// ---------- desk post ----------
function verifyLine(c){
  if(!c)return '<div class="vf">❌ 暂无链上龙头（只有梗）</div>';
  const v=vals(c),rk=risky(c),liqOK=(v.liq||0)>=20000;
  return `<div class="vf">${c.snap?"✅":"❌"} GMGN 核验 · ${liqOK?"✅":"❌"} 流动性 <span ${L(c,"liq")}>${money(v.liq)}</span>${rk.length?` · <span class="r">⚠ ${esc(rk.join(" "))}</span>`:""}</div>`}
function post(t,tag){
  const c=(t.coins||[])[0],v=c?vals(c):{};
  const bullets=[t.verdict,...(t.play||[]).slice(0,2),...(t.firsts||[]).slice(0,1)].filter(Boolean).slice(0,4);
  return `<div class="post"><div class="ph" data-open="${t.id}"><div class="tile">${t.emoji}</div><div style="min-width:0">
   <div class="hl">${c?`<span class="tk">$${esc(c.sym)}</span> `:""}${esc(tname(t))}</div>
   <div class="meta">${c?`<b ${L(c,"mcap")}>${money(v.mcap)}</b> · 1h <span class="${pc(v.h1)}" ${L(c,"h1")}>${pct(v.h1)}</span> · `:""}热度 <span class="y">${t.heat}</span> ${arrow(t.trend)} · ${tag}</div></div></div>
   ${verifyLine(c)}
   ${bullets.map(p=>`<div class="gt">&gt;${esc(p)}</div>`).join("")}
   ${(t.coins||[]).length>1?`<div class="rel">${t.coins.slice(1,4).map(b=>`<span><span class="y">$${esc(b.sym)}</span> <span ${L(b,"mcap")}>${money(vals(b).mcap)}</span></span>`).join("")}</div>`:""}
   ${c?caRow(c):""}</div>`}
function radarPost(radar){
  if(!radar.length)return"";
  return `<div class="post"><div class="ph"><div class="tile">📡</div><div style="min-width:0"><div class="hl">新币雷达</div><div class="meta">GMGN 热榜 · 24h 新币/1h 暴涨 · 叙事未核实</div></div></div>
   ${radar.slice(0,5).map(r=>`<div class="gt" style="color:var(--ink)"><span class="g">&gt;</span><span class="y">$${esc(r.sym)}</span> ${money(r.mcap)} <span class="${pc(r.chg1h)}">${pct(r.chg1h)}</span> <span class="sub">${ageTxt(r.created)}</span></div>`).join("")}</div>`}
function muskPost(d){
  const m=d.musk||{summary:[]};if(!(m.summary||[]).length)return"";
  const top=(d.posts||[]).filter(p=>/elon|musk/i.test(p.author)).sort((a,b)=>b.views-a.views).slice(0,2);
  return `<div class="post"><div class="ph"><div class="tile">👁</div><div style="min-width:0"><div class="hl">马斯克在关注</div><div class="meta">${esc(d.meta.musk_window||"")}</div></div></div>
   ${m.summary.slice(0,3).map(s=>`<div class="gt">&gt;${esc(s)}</div>`).join("")}
   ${top.map(p=>`<div class="rel"><a href="${p.link}" target="_blank" rel="noopener">↗ ${esc(p.text.length>34?p.text.slice(0,34)+"…":p.text)}</a> <span>${fmt(p.views)}</span></div>`).join("")}</div>`}
let coinSort="mcap";
function render(d){
  D=d;$("#upd").textContent=d.meta.updated_label;
  const act=d.topics.filter(t=>t.status==="active").sort((a,b)=>b.heat-a.heat);
  const t24=act.filter(t=>t.horizon==="24h").sort((a,b)=>(b.momentum||0)-(a.momentum||0));
  const cyc=act.filter(t=>t.horizon!=="24h");
  const rising=cyc.slice().sort((a,b)=>(b.momentum||0)-(a.momentum||0)).slice(0,Math.max(0,3-t24.length));
  const radar=(d.radar||[]).slice().sort((a,b)=>(b.first_seen.slice(0,13)>a.first_seen.slice(0,13))-(b.first_seen.slice(0,13)<a.first_seen.slice(0,13))||b.mom-a.mom);
  $("#p-desk").innerHTML=`<div class="term"><div class="boardh"><h1>/alpha/ - 叙事 &amp; 链上</h1><div>24h 叙事 · 每个币都经 GMGN 核验</div>${d.headline?.text?`<div class="alert">${esc(d.headline.text)}</div>`:""}</div>
    ${t24.map(t=>post(t,"24h")).join("")}${rising.map(t=>post(t,"升温")).join("")}${radarPost(radar)}${muskPost(d)}
    <div class="live livebar"></div>
    <div class="foot"><b>BOARD</b><span>/alpha/</span><em>${t24.length+rising.length} threads</em></div></div>`;
  // coins
  const all=act.flatMap(t=>(t.coins||[]).map((c,i)=>({c,t,i})));
  const pinned=all.filter(x=>x.i===0).sort((a,b)=>(vals(b.c).mcap||0)-(vals(a.c).mcap||0));
  const rest=all.filter(x=>x.i>0);
  const sorter={mcap:(a,b)=>(vals(b.c).mcap||0)-(vals(a.c).mcap||0),"1h":(a,b)=>(vals(b.c).h1??-1e9)-(vals(a.c).h1??-1e9),newest:(a,b)=>((b.c.snap||{}).created||0)-((a.c.snap||{}).created||0)}[coinSort];
  const tot=all.reduce((s,x)=>s+(vals(x.c).mcap||0),0);
  $("#p-coins").innerHTML=`<div class="term"><div class="sec">Pinned</div><div class="secsub">各话题龙头 · ${pinned.length} 个</div>${pinned.map(x=>ccard(x.c,x.t)).join("")}<div class="live livebar"></div></div>
   <div class="term"><div class="l1"><div class="sec">Betas</div><div class="sorts">${[["mcap","market cap"],["1h","1h"],["newest","newest"]].map(([k,l])=>`<button data-sort="${k}" class="${coinSort===k?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="secsub">${rest.length} coins · 总市值 ${money(tot)}</div>${rest.sort(sorter).map(x=>ccard(x.c,x.t)).join("")}</div>
   ${(d.pruned||[]).length?`<div class="term"><div class="sec r">Deleted</div><div class="secsub">死盘/归零/仿盘，已删除</div>${d.pruned.slice().reverse().map(p=>`<div class="ev"><span class="t">${esc(p.date.slice(0,5))}</span><span class="tag DEL">DEL</span><span class="m"><span class="y">$${esc(p.sym)}</span> ${esc(p.reason)}</span></div>`).join("")}</div>`:""}`;
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=e=>{e.stopPropagation();coinSort=b.dataset.sort;render(D);document.querySelector('.tab[data-p="coins"]').click()});
  // topics
  const ret=d.topics.filter(t=>t.status!=="active");
  $("#p-topics").innerHTML=`<div class="term"><div class="sec">大周期</div><div class="secsub">热度 0–100 · 方块＝近 7 日讨论量，越亮越热</div>
   ${cyc.map((t,i)=>{const c=(t.coins||[])[0];return `<div class="trow" data-open="${t.id}"><div class="l1"><span class="nm"><span class="dim">${i+1}</span> ${t.emoji} ${esc(tname(t))}</span><span style="white-space:nowrap"><span class="y" style="font-weight:700">${t.heat}</span> ${arrow(t.trend)}</span></div>
     <div class="l1" style="margin-top:6px"><span class="meta">${c?`<span class="y">$${esc(c.sym)}</span> <span ${L(c,"mcap")}>${money(vals(c).mcap)}</span>`:"暂无链上币"}</span>${gridHTML(t)}</div></div>`}).join("")}</div>
   ${ret.length?`<div class="term"><div class="sec sub">已归档</div>${ret.map(t=>`<div class="retired" data-open="${t.id}">${t.emoji} ${esc(tname(t))}</div>`).join("")}</div>`:""}`;
  // feed
  $("#p-feed").innerHTML=`<div class="term"><div id="meters">${deskMeters()}</div></div>
   <div class="term"><div class="secsub" style="margin:0"><span class="l">ALERT</span> 推送 · <span class="g">NEW</span> 新币 · <span class="r">DEL</span> 删除 · <span class="y">VERIFY</span> 核验</div>${feedLog(feedItems(d).slice(0,60))}</div>`;
  // rank
  $("#p-rank").innerHTML=`<div class="term" style="padding:0"><table class="tt"><colgroup><col style="width:34px"><col><col style="width:50px"><col style="width:58px"><col style="width:52px"></colgroup>
   <tr><th>#</th><th>topic</th><th class="n">heat</th><th class="n">7d</th><th>state</th></tr>
   ${act.map((t,i)=>`<tr data-open="${t.id}" style="cursor:pointer"><td class="sub">${i+1}</td><td>${esc(tname(t))}</td><td class="n y">${t.heat}</td><td class="n ${t.delta>0?"g":t.delta<0?"r":""}">${t.delta>0?"+":""}${t.delta}%</td><td class="sub">${t.horizon==="24h"?"24H":t.trend==="up"?"HOT":t.trend==="down"?"COOL":"IDLE"}</td></tr>`).join("")}</table>
   <div class="foot" style="margin:0"><b>RANK</b><span>last 7 days</span><em>${act.length} topics</em></div></div>`;
  setLive();applyLive();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+b.dataset.p));scrollTo(0,0)});
function sheets(){
  const posts=(D.posts||[]).map(p=>({时间_悉尼:p.time,作者:p.author,内容:p.text,链接:p.link,主题:p.topic,热度:"█".repeat(p.heat)+"░".repeat(10-p.heat),浏览量:p.views}));
  const seen=new Set((D.posts||[]).map(p=>p.link));
  D.topics.forEach(t=>(t.sources||[]).forEach(s=>{if(!seen.has(s.url)){seen.add(s.url);posts.push({时间_悉尼:"",作者:"",内容:s.label,链接:s.url,主题:t.name,热度:"",浏览量:""})}}));
  const ds=[...new Set(D.topics.flatMap(t=>Object.keys(t.history||{})))].sort();
  const heat=D.topics.slice().sort((a,b)=>b.heat-a.heat).map(t=>{const o={排名:t.rank??"",话题:t.name,状态:t.status,热度:t.heat,趋势:{up:"↑",down:"↓"}[t.trend]||"→",龙头:t.leader.sym,结论:t.verdict};ds.forEach(x=>o[x.slice(5)+"帖数"]=t.history[x]?.est??"");return o});
  const coins=D.topics.flatMap(t=>(t.coins||[]).map((c,i)=>{const v=vals(c);return {话题:t.name,周期:t.horizon==="24h"?"24小时":"大周期",角色:i?"beta":"龙头",代币:c.sym,链:c.chain,CA:c.ca,状态:c.status,市值:Math.round(v.mcap||0),"1h%":v.h1,"24h%":v.h24,流动性:Math.round(v.liq||0),叙事:c.blurb,GMGN:gmLink(c)}}));
  return {posts,heat,coins};
}
function doExport(){
  const {posts,heat,coins}=sheets(),name="alpha_"+D.meta.updated.slice(0,10);
  if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(posts),"帖子与来源");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(heat),"话题热度");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(coins),"代币");XLSX.writeFile(wb,name+".xlsx");return}
  const csv=rows=>{const k=Object.keys(rows[0]);return [k.join(",")].concat(rows.map(o=>k.map(x=>'"'+String(o[x]??"").replace(/"/g,'""')+'"').join(","))).join("\n")};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv(posts)+"\n\n"+csv(heat)+"\n\n"+csv(coins)],{type:"text/csv"}));a.download=name+".csv";a.click();
}
$("#xl").onclick=doExport;
const emb=JSON.parse($("#embedded").textContent);render(emb);
const legacy={h24:"desk",home:"topics",lead:"coins",hist:"feed",musk:"desk",export:"desk"};
{let h=location.hash.slice(1);h=legacy[h]||h;const b=h&&document.querySelector(`.tab[data-p="${h}"]`);if(b)b.click();else if(h.startsWith("t=")&&D.topics.some(x=>x.id===h.slice(2)))detail(h.slice(2))}
fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.version>=3&&((d.meta.prices_updated||"")>(emb.meta.prices_updated||"")||d.meta.updated>emb.meta.updated)){const cur=document.querySelector(".tab.on");render(d);cur&&cur.click()}}).catch(()=>{}).finally(()=>{live();setInterval(live,60000)});
</script>
</body>
